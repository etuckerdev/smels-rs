[package]
name = "smels"
version = "0.1.0"
edition = "2021"
description = "Small Model Error Log Summarizer for multiple programming languages"
repository = "https://github.com/etuckerdev/smels-rs"
license = "Apache-2.0"
keywords = ["error-analysis", "debugging", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
regex = "1.10"
tokio = { version = "1.0", features = ["full"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ollama-rs = { version = "0.3", optional = true }
md-5 = "0.10"
chrono = "0.4.42"
lazy_static = "1.5.0"
axum = { version = "0.7", features = ["json"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.5", features = ["cors", "fs"], optional = true }
clap = { version = "4.0", features = ["derive"] }
walkdir = "2.4"

[features]
default = ["cli"]
cli = ["tokio"]
ai = ["ollama-rs"]
web = ["tokio", "axum", "tower", "tower-http"]
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: github.repository_owner == 'etuckerdev'  # Replace with your GitHub username

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --all-features

    - name: Build documentation
      run: cargo doc --no-deps --all-features

    - name: Publish to crates.io
      run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: github.repository_owner == 'etuckerdev'  # Replace with your GitHub username

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build release binaries
      run: |
        cargo build --release --target x86_64-unknown-linux-gnu
        cargo build --release --target x86_64-apple-darwin
        cargo build --release --target x86_64-pc-windows-gnu

    - name: Create release archives
      run: |
        cd target/release
        tar czf smels-linux-x86_64.tar.gz smels
        cd ../..
        cd target/x86_64-apple-darwin/release
        tar czf ../../../target/release/smels-macos-x86_64.tar.gz smels
        cd ../../..
        cd target/x86_64-pc-windows-gnu/release
        zip ../../../target/release/smels-windows-x86_64.zip smels.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          target/release/smels-linux-x86_64.tar.gz
          target/release/smels-macos-x86_64.tar.gz
          target/release/smels-windows-x86_64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
